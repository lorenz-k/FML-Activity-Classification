[project]
name = "fml-activity-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flwr>=1.22.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.52.1",
    "torch>=2.11.0",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
fml-activity-classification = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "fml-activity-classification",
]
