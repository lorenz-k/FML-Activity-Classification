      - src.flower_client
    environment:
      CLIENT_ID: 2
      SERVER_ADDRESS: flower-server:8080
      LOCAL_EPOCHS: ${LOCAL_EPOCHS:-1}
      BATCH_SIZE: ${BATCH_SIZE:-64}
      LR: ${LR:-0.001}
      HIDDEN_DIM: ${HIDDEN_DIM:-128}
      DROPOUT: ${DROPOUT:-0.2}
    depends_on:
      - flower-server
    volumes:
      - ./outputs:/app/outputs

  flower-client-3:
    build: .
    image: fml-flower:local
    restart: on-failure
